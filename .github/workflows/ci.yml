name: CI

on:
  push:
    branches: [master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # Indexing, which only an editor uses, is off in every build.
  macos:
    name: macOS (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests --disable-index-store 2>&1 | xcbeautify --renderer github-actions
      - name: Test
        run: swift test --skip-build 2>&1 | xcbeautify --renderer github-actions

  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # The simulator boots while the tests build. The test step boots it otherwise.
      - name: Boot the simulator
        continue-on-error: true
        run: |
          device=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          echo "IOS_SIMULATOR=$device" >> "$GITHUB_ENV"
          xcrun simctl boot "$device"
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify
      - name: Build
        run: |
          xcodebuild build-for-testing -scheme Vox -destination "id=$IOS_SIMULATOR" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | xcbeautify --renderer github-actions
      # Swift Testing runs the tests in parallel in one process. Parallel testing in xcodebuild would
      # clone and boot more simulators.
      - name: Test
        run: |
          xcrun simctl bootstatus "$IOS_SIMULATOR" -b
          xcodebuild test-without-building -scheme Vox -destination "id=$IOS_SIMULATOR" \
            -parallel-testing-enabled NO 2>&1 | xcbeautify --renderer github-actions

  platforms:
    name: ${{ matrix.platform }} (xcodebuild build)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, watchOS]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify
      - name: Build
        run: |
          xcodebuild build -scheme Vox -destination "generic/platform=${{ matrix.platform }}" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | xcbeautify --renderer github-actions

  linux:
    name: Linux (swift test)
    runs-on: ubuntu-latest
    container: swift:6.1-jammy
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      # The tests run in parallel, and non-atomic counters lose updates, so code that runs once
      # can look uncovered.
      - name: Build
        run: swift build --build-tests --enable-code-coverage -Xswiftc -Xllvm -Xswiftc -instrprof-atomic-counter-update-all
      - name: Test
        run: swift test --skip-build --enable-code-coverage
      - name: Coverage
        run: |
          bin=$(swift build --show-bin-path)
          report=$(llvm-cov report "$bin/VoxPackageTests.xctest" \
            -instr-profile="$bin/codecov/default.profdata" \
            -ignore-filename-regex='/(Tests|\.build)/')
          echo "$report"
          # The coverage summary format of Istanbul, which the badge job reads. Regions stand in
          # for statements, and percentages are rounded down.
          mkdir -p coverage
          echo "$report" | awk '
            function total(count, missed,   pct) {
              pct = count ? int((count - missed) * 10000 / count) / 100 : 100
              return sprintf("{\"total\":%d,\"covered\":%d,\"skipped\":0,\"pct\":%s}", count, count - missed, pct)
            }
            $1 == "TOTAL" {
              printf "{\"total\":{\"lines\":%s,\"statements\":%s,\"functions\":%s,\"branches\":%s}}\n", total($8, $9), total($2, $3), total($5, $6), total($11, $12)
            }' > coverage/coverage-summary.json
          cat coverage/coverage-summary.json
          echo "$report" | awk '
            $1 == "TOTAL" { found = 1; missed = $3 + $6 + $9 }
            END { if (!found || missed) { print "::error::Some library code is not covered by the tests."; exit 1 } }'
      - uses: actions/upload-artifact@v4
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json

  coverage-badge:
    name: Coverage badge
    needs: [macos, ios, platforms, linux, cocoapods, carthage]
    # Publishes badges/coverage.svg to the gh-pages branch, next to the project site, once every
    # other job has passed. The linux job fails when any library code isn't covered.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - uses: actions/download-artifact@v4
        with:
          name: coverage-summary
          path: ${{ runner.temp }}/coverage
      - name: Render
        run: |
          npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP" badgen@3.3.2
          # badgen names the gradient and the mask randomly, and fixed names leave the file
          # unchanged while the coverage is.
          node -e '
            const { badgen } = require(process.env.RUNNER_TEMP + "/node_modules/badgen");
            const total = require(process.env.RUNNER_TEMP + "/coverage/coverage-summary.json").total;
            const pct = Math.min(...["lines", "statements", "functions", "branches"].map(key => total[key].pct));
            let svg = badgen({ label: "coverage", status: pct + "%", color: pct >= 95 ? "green" : "orange" });
            [...svg.matchAll(/ id="(\w+)"/g)].forEach(([, id], index) => {
              svg = svg.replaceAll(`"${id}"`, `"badge-${index}"`).replaceAll(`#${id})`, `#badge-${index})`);
            });
            require("fs").writeFileSync(process.env.RUNNER_TEMP + "/coverage.svg", svg + "\n");
          '
      - name: Publish
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          # Another run can push in between, so every attempt starts from the latest gh-pages.
          for attempt in 1 2 3 4 5; do
            git fetch origin gh-pages
            git reset --hard origin/gh-pages
            mkdir -p badges
            cp "$RUNNER_TEMP/coverage.svg" badges/coverage.svg
            git add badges/coverage.svg
            if git diff --cached --quiet; then
              echo "The badge is up to date."
              exit 0
            fi
            git commit -m 'Update badges [skip ci]'
            git push origin HEAD:gh-pages && exit 0
            sleep $((attempt * 5))
          done
          exit 1

  cocoapods:
    name: CocoaPods (pod lib lint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Lint
        run: pod lib lint --allow-warnings --platforms=ios,macos

  carthage:
    name: Carthage (carthage build)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install Carthage
        run: command -v carthage || brew install carthage
      # Builds the shared schemes of Vox.xcodeproj, as Carthage does for apps that depend on Vox.
      # Simulator builds need a simulator of their platform, and the platforms job builds tvOS
      # and watchOS.
      - name: Build
        run: carthage build --no-skip-current --use-xcframeworks --platform iOS,macOS
