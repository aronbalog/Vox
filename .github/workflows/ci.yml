name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  macos:
    name: macOS (swift test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify
      - name: Toolchain
        run: swift --version
      - name: Build
        run: swift build --build-tests 2>&1 | xcbeautify --renderer github-actions
      - name: Test
        run: swift test --skip-build 2>&1 | xcbeautify --renderer github-actions

  ios:
    name: iOS Simulator (xcodebuild test)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify
      - name: Test
        run: |
          device=$(xcrun simctl list devices available --json \
            | jq -r '[.devices | to_entries[] | select(.key | contains("iOS")) | .value[] | select(.name | startswith("iPhone"))][0].udid')
          xcodebuild test -scheme Vox -destination "id=$device" 2>&1 | xcbeautify --renderer github-actions

  platforms:
    name: ${{ matrix.platform }} (xcodebuild build)
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        platform: [tvOS, watchOS]
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install xcbeautify
        run: command -v xcbeautify || brew install xcbeautify
      - name: Build
        run: xcodebuild build -scheme Vox -destination "generic/platform=${{ matrix.platform }}" 2>&1 | xcbeautify --renderer github-actions

  cocoapods:
    name: CocoaPods (pod lib lint)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Lint
        run: pod lib lint --allow-warnings --platforms=ios,macos
